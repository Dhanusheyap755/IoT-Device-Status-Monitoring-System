name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Validate Production API URL
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error title=Missing VITE_API_BASE_URL::Repository variable VITE_API_BASE_URL is not configured. Please add your deployed Render backend URL (e.g. https://your-backend.onrender.com/api) under Repo Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          echo "Production API Base URL configured: $API_URL"

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build React Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
