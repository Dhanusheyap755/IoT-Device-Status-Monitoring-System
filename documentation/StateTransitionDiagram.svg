<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>

    <!-- Filters for subtle shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="620" fill="#F8FAFC" rx="16" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="70" fill="#1E3A8A" rx="16" />
  <rect x="0" y="50" width="960" height="20" fill="#1E3A8A" />
  <text x="30" y="36" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
    State Transition Diagram — IoT Device Status Monitoring System
  </text>
  <text x="30" y="56" font-family="Inter, sans-serif" font-size="12" fill="#93C5FD">
    Course: Formal Languages and Automata Theory (FLAT) | Register No: 24ITR018 | VCET, Erode
  </text>

  <!-- Initial State Pointer (q0) -->
  <circle cx="60" cy="220" r="10" fill="#1E293B" />
  <path d="M 70 220 L 150 220" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="75" y="210" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#475569">
    Start (Provision)
  </text>

  <!-- STATE 1: REGISTERED (q0) -->
  <g transform="translate(160, 160)" filter="url(#shadow)">
    <rect width="180" height="120" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="3" />
    <text x="90" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">Registered</text>
    <text x="90" y="52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">(q0: Initial State)</text>
    <line x1="16" y1="62" x2="164" y2="62" stroke="#FDE68A" stroke-width="1.5" />
    <text x="90" y="82" font-family="Inter, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">Awaiting first</text>
    <text x="90" y="98" font-family="Inter, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">telemetry message</text>
  </g>

  <!-- STATE 2: ACTIVE (F: Accepting / Operational) -->
  <g transform="translate(620, 160)" filter="url(#shadow)">
    <!-- Outer accepting ring -->
    <rect x="-8" y="-8" width="196" height="136" rx="22" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
    <rect width="180" height="120" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="3" />
    <text x="90" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle">Active</text>
    <text x="90" y="52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">(F: Operational State)</text>
    <line x1="16" y1="62" x2="164" y2="62" stroke="#A7F3D0" stroke-width="1.5" />
    <text x="90" y="82" font-family="Inter, sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">Authenticated &amp;</text>
    <text x="90" y="98" font-family="Inter, sans-serif" font-size="11" fill="#064E3B" text-anchor="middle">Streaming Valid Data</text>
  </g>

  <!-- STATE 3: DISCONNECTED -->
  <g transform="translate(390, 440)" filter="url(#shadow)">
    <rect width="180" height="120" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="3" />
    <text x="90" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">Disconnected</text>
    <text x="90" y="52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">(Outage / Timeout)</text>
    <line x1="16" y1="62" x2="164" y2="62" stroke="#FECACA" stroke-width="1.5" />
    <text x="90" y="82" font-family="Inter, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">Unreachable or</text>
    <text x="90" y="98" font-family="Inter, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">Keepalive Expired</text>
  </g>

  <!-- TRANSITION: Registered -> Active (ValidMessage) -->
  <path d="M 340 200 L 610 200" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="400" y="180" width="150" height="20" rx="4" fill="#FFFFFF" stroke="#D1FAE5" />
  <text x="475" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle">
    Valid Message
  </text>

  <!-- TRANSITION: Registered -> Disconnected (Failure / Timeout) -->
  <path d="M 250 280 L 390 450" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="230" y="350" width="160" height="20" rx="4" fill="#FFFFFF" stroke="#FEE2E2" />
  <text x="310" y="364" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#991B1B" text-anchor="middle">
    Failure / Timeout
  </text>

  <!-- TRANSITION: Active -> Disconnected (Failure / Timeout) -->
  <path d="M 700 280 L 570 450" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="580" y="350" width="160" height="20" rx="4" fill="#FFFFFF" stroke="#FEE2E2" />
  <text x="660" y="364" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#991B1B" text-anchor="middle">
    Failure / Timeout
  </text>

  <!-- TRANSITION: Disconnected -> Active (Valid Message / Reconnect) -->
  <path d="M 520 440 C 580 380, 620 340, 660 285" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="520" y="385" width="180" height="20" rx="4" fill="#FFFFFF" stroke="#D1FAE5" />
  <text x="610" y="399" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">
    Valid Message / Reconnect
  </text>

  <!-- SELF-LOOP 1: Registered (InvalidMessage) -->
  <path d="M 210 160 C 210 100, 290 100, 290 155" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="180" y="85" width="140" height="18" rx="4" fill="#FFFFFF" stroke="#FDE68A" />
  <text x="250" y="98" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">
    Invalid Message [Alert]
  </text>

  <!-- SELF-LOOP 2: Active (ValidMessage) & (InvalidMessage) -->
  <path d="M 670 160 C 670 90, 770 90, 770 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="630" y="90" width="180" height="30" rx="4" fill="#FFFFFF" stroke="#A7F3D0" />
  <text x="720" y="103" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">
    Valid Message (Store Data)
  </text>
  <text x="720" y="116" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#B45309" text-anchor="middle">
    Invalid Message (Alert/Hold)
  </text>

  <!-- SELF-LOOP 3: Disconnected (Failure / Timeout / Invalid) -->
  <path d="M 440 560 C 440 610, 520 610, 520 565" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="385" y="585" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="480" y="600" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">
    Failure / Timeout / Invalid
  </text>

</svg>
